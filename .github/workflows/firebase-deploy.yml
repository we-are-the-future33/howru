name: Deploy Cloud Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies
        run: npm install
        working-directory: functions

      # 서비스 계정 키는 JSON 원문이든 base64든 모두 받습니다. 키는 출력하지 않습니다.
      - name: Prepare credentials
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT2 }}
        run: |
          KEY_FILE="$RUNNER_TEMP/sa.json"
          if printf '%s' "$SA_KEY" | head -c 1 | grep -q '{'; then
            printf '%s' "$SA_KEY" > "$KEY_FILE"
          else
            printf '%s' "$SA_KEY" | base64 -d > "$KEY_FILE" 2>/dev/null
          fi
          if ! node -e "const k=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(!k.client_email||!k.private_key)process.exit(1)" "$KEY_FILE"; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT2 secret is not a valid service account JSON (raw or base64)"
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$KEY_FILE" >> "$GITHUB_ENV"

      # 시트 연동 함수가 Google Sheets API를 쓰므로 프로젝트에서 켜져 있어야 합니다. 이미 켜져 있으면 아무 일도 없습니다.
      - name: Enable Google Sheets API
        run: |
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet 2>&1 | tail -1
          gcloud services enable sheets.googleapis.com --project howru-app --quiet 2>&1 | tail -3 \
            || echo "::warning::Could not enable sheets.googleapis.com from CI. Enable it manually in the Cloud console."

      # 이전 배포가 중간에 실패해 반쯤 만들어진 syncEntryToSheet가 있으면 firebase-tools가 죽습니다. 정상(ACTIVE)이 아니면 지우고 새로 만듭니다.
      - name: Clean up broken syncEntryToSheet
        run: |
          STATE=$(gcloud functions describe syncEntryToSheet --gen2 --region asia-northeast3 --project howru-app --format='value(state)' 2>&1 | tail -1)
          echo "syncEntryToSheet state: $STATE"
          if [ -n "$STATE" ] && [ "$STATE" != "ACTIVE" ] && ! echo "$STATE" | grep -qi "not found\|ERROR"; then
            gcloud functions delete syncEntryToSheet --gen2 --region asia-northeast3 --project howru-app --quiet 2>&1 | tail -3
          fi

      # 실패하면 로그 마지막 60줄을 Actions 주석(annotation)으로 남깁니다.
      - name: Deploy to Firebase
        run: |
          set +e
          npx --yes firebase-tools@14.10.1 deploy --only functions --project howru-app --force --non-interactive --debug 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            TAIL=$(grep -iE "error|fail|denied|permission|403|400|409|quota|HTTP" "$RUNNER_TEMP/deploy.log" | grep -v "npm warn" | tail -n 25 | sed 's/\x1b\[[0-9;]*m//g' | cut -c1-300)
            TAIL="${TAIL//'%'/'%25'}"
            TAIL="${TAIL//$'\r'/}"
            TAIL="${TAIL//$'\n'/'%0A'}"
            echo "::error title=firebase deploy log::${TAIL}"
            exit "$code"
          fi
